[profile.default]
src = "src"
out = "out"
libs = ["lib"]

remappings = [
    "@openzeppelin-contracts/=lib/openzeppelin-contracts/contracts/",
    "ds-test/=lib/ds-test/src/",
    "@openzeppelin-contracts-06/=lib/openzeppelin-contracts/contracts/",
    "openzeppelin-contracts-08/=lib/openzeppelin-contracts-08/contracts/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/contracts/",
    "openzeppelin-contracts-06/=lib/openzeppelin-contracts-05/contracts/",
    "openzeppelin-contracts-v5.4.0/=lib/openzeppelin-contracts/contracts",
    "openzeppelin-contracts-v4.6.0/=lib/oz-v4.6.0/contracts"
]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
